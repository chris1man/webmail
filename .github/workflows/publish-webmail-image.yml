name: Publish webmail image

on:
  push:
    branches:
      - codex/smart-message-title-gallery

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/webmail:smart-title-gallery
            ghcr.io/${{ github.repository_owner }}/webmail:sha-${{ github.sha }}

      - name: Build and publish mail alerts
        uses: docker/build-push-action@v6
        with:
          context: ./services/mail-alerts
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mail-alerts:smart-title-gallery
            ghcr.io/${{ github.repository_owner }}/mail-alerts:sha-${{ github.sha }}

      - name: Trigger Portainer redeploy
        env:
          PORTAINER_WEBHOOK_BULWARK_TEST: ${{ secrets.PORTAINER_WEBHOOK_BULWARK_TEST }}
        run: |
          test -n "$PORTAINER_WEBHOOK_BULWARK_TEST"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST "$PORTAINER_WEBHOOK_BULWARK_TEST"
