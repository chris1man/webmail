name: Publish mail alerts image

on:
  push:
    branches:
      - main
      - codex/mail-alerts-telegram
    paths:
      - "services/mail-alerts/**"
      - "docker-compose.mail-alerts.yml"
      - ".github/workflows/publish-mail-alerts.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ./services/mail-alerts
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mail-alerts:mail-alerts-telegram
            ghcr.io/${{ github.repository_owner }}/mail-alerts:sha-${{ github.sha }}

      - name: Trigger Portainer redeploy
        if: github.ref == 'refs/heads/codex/mail-alerts-telegram'
        env:
          PORTAINER_WEBHOOK_MAIL_ALERTS: ${{ secrets.PORTAINER_WEBHOOK_MAIL_ALERTS }}
        run: |
          test -n "$PORTAINER_WEBHOOK_MAIL_ALERTS"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --request POST "$PORTAINER_WEBHOOK_MAIL_ALERTS"
