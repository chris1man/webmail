services:
  mail-alerts:
    image: ghcr.io/chris1man/mail-alerts:smart-title-gallery
    pull_policy: always
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ALERTS_UI_USERNAME: ${ALERTS_UI_USERNAME}
      ALERTS_UI_PASSWORD: ${ALERTS_UI_PASSWORD}
      TZ: Asia/Tomsk
    volumes:
      - mail_alerts_data:/data
    networks:
      - proxy-network

volumes:
  mail_alerts_data:

networks:
  proxy-network:
    external: true
