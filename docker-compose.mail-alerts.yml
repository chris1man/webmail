services:
  mail-alerts:
    image: ghcr.io/chris1man/mail-alerts:mail-alerts-telegram
    pull_policy: always
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ALERTS_UI_USERNAME: ${ALERTS_UI_USERNAME}
      ALERTS_UI_PASSWORD: ${ALERTS_UI_PASSWORD}
      STALWART_JMAP_URL: ${STALWART_JMAP_URL:-http://stalwart:8080/jmap}
      STALWART_API_TOKEN: ${STALWART_API_TOKEN:-}
      TZ: Asia/Tomsk
    volumes:
      - mail_alerts_data:/data
    networks:
      - proxy-network
      - mail-network

volumes:
  mail_alerts_data:

networks:
  proxy-network:
    external: true
  mail-network:
    external: true
